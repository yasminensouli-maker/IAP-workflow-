# Amplify custom response headers.
#
# The <meta http-equiv="Cache-Control"> tags inside index.html do NOT control
# how index.html itself is cached -- by the time a browser reads them it has
# already taken the response from cache. Only a real HTTP header does that,
# and this file is how Amplify sets one.
#
# no-store on the page means the browser must fetch it every time, so a deploy
# is visible on the next normal reload with no hard refresh required.
customHeaders:
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, no-cache, must-revalidate, max-age=0'
      - key: 'Pragma'
        value: 'no-cache'
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, no-cache, must-revalidate, max-age=0'
      - key: 'Pragma'
        value: 'no-cache'
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
